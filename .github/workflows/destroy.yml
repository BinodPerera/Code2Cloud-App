name: Destroy AWS Cloud Infrastructure (Teardown)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm permanent deletion of all cloud resources'
        required: true
        default: 'DESTROY'

jobs:
  teardown:
    name: Teardown AWS Cloud Resources
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Resolve Terraform Remote State S3 Bucket
      - name: Resolve Terraform Remote State S3 Bucket
        id: state-bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="code2cloud-tfstate-${ACCOUNT_ID}-us-east-1"
          echo "bucket_name=$BUCKET" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.state-bucket.outputs.bucket_name }}" \
            -backend-config="key=code2cloud-app/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve -no-color

      # Teardown ECR Container Repositories
      
      
      - name: Delete ECR Repository (backend)
        run: |
          ECR_REPO="code2cloud-app-backend"
          echo "Deleting ECR repository $ECR_REPO and all contained images..."
          aws ecr delete-repository --repository-name "$ECR_REPO" --force || true
      
      - name: Delete ECR Repository (frontend)
        run: |
          ECR_REPO="code2cloud-app-frontend"
          echo "Deleting ECR repository $ECR_REPO and all contained images..."
          aws ecr delete-repository --repository-name "$ECR_REPO" --force || true
      
      